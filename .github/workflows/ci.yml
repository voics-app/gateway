name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly cold build (CI_CACHE off): proves the persistent CI cache hides nothing (ADR 0022)
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: voics-app/.github/.github/workflows/gitflow-guard.yml@main

  elixir:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: voics-app/.github/.github/workflows/elixir.yml@main
    with:
      image-name: gateway
      description: Discordy realtime gateway
    secrets: inherit

  docker:
    needs: elixir
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: voics-app/.github/.github/workflows/docker.yml@main
    with:
      image-name: gateway
      description: "Discordy realtime gateway: WebSocket sessions, guild fan-out, voice allocation, E2EE and P2P relay"
    secrets: inherit
