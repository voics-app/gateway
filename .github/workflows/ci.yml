name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  elixir:
    uses: discordy-voics/.github/.github/workflows/elixir.yml@main
    with:
      image-name: gateway
      description: Discordy realtime gateway
    secrets: inherit

  docker:
    needs: elixir
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: gateway
      description: "Discordy realtime gateway: WebSocket sessions, guild fan-out, voice allocation, E2EE and P2P relay"
    secrets: inherit
